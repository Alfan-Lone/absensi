<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   KOORDINAT SEKOLAH
===================================================== */

const SEKOLAH_LAT =
  -7.091200000000;

const SEKOLAH_LNG =
  107.135900000000;


/*
   MAKSIMAL JARAK DARI SEKOLAH

   100 meter
*/

const BATAS_JARAK =
  100;


/*
   AKURASI GPS MAKSIMAL

   Jika GPS mengatakan akurasinya
   lebih buruk dari 150 meter,
   lokasi dianggap tidak cukup akurat.
*/

const BATAS_AKURASI =
  150;


/* =====================================================
   VARIABEL
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

let fotoBlob = null;

let sedangMengirim = false;

let lokasiSaatIni = null;


/* =====================================================
   TANGGAL
===================================================== */

function tampilkanTanggal() {

  const sekarang =
    new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  document.getElementById("tanggal")
    .textContent = tanggal;
}

tampilkanTanggal();


/* =====================================================
   HITUNG JARAK GPS
===================================================== */

function hitungJarak(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =====================================================
   UPDATE TAMPILAN LOKASI
===================================================== */

function tampilkanLokasi(
  pesan,
  tipe
) {

  const box =
    document.getElementById(
      "locationStatus"
    );

  box.textContent =
    pesan;

  box.className =
    "location-box " + tipe;
}


/* =====================================================
   CEK LOKASI
===================================================== */

function cekLokasi() {

  if (!navigator.geolocation) {

    tampilkanLokasi(
      "❌ Browser tidak mendukung GPS.",
      "location-error"
    );

    return;
  }


  tampilkanLokasi(
    "📍 Memeriksa lokasi GPS...",
    "location-loading"
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      const jarak =
        hitungJarak(
          latitude,
          longitude,
          SEKOLAH_LAT,
          SEKOLAH_LNG
        );


      console.log(
        "Latitude:",
        latitude
      );

      console.log(
        "Longitude:",
        longitude
      );

      console.log(
        "Akurasi:",
        accuracy
      );

      console.log(
        "Jarak:",
        jarak
      );


      /*
        Simpan lokasi yang sudah diperiksa
      */

      lokasiSaatIni = {
        latitude: latitude,
        longitude: longitude,
        accuracy: accuracy,
        jarak: jarak
      };


      /*
        GPS terlalu tidak akurat
      */

      if (
        accuracy >
        BATAS_AKURASI
      ) {

        tampilkanLokasi(
          "⚠️ GPS kurang akurat. Akurasi: " +
          Math.round(accuracy) +
          " meter.",
          "location-error"
        );

        tombolAbsensi(false);

        return;
      }


      /*
        Di luar sekolah
      */

      if (
        jarak >
        BATAS_JARAK
      ) {

        tampilkanLokasi(
          "❌ Anda berada di luar area sekolah. Jarak: " +
          Math.round(jarak) +
          " meter.",
          "location-error"
        );

        tombolAbsensi(false);

        return;
      }


      /*
        LOKASI VALID
      */

      tampilkanLokasi(
        "✅ Lokasi valid. Jarak dari sekolah: " +
        Math.round(jarak) +
        " meter.",
        "location-success"
      );

      tombolAbsensi(true);

    },

    function(error) {

      console.error(error);


      tombolAbsensi(false);


      if (
        error.code === 1
      ) {

        tampilkanLokasi(
          "❌ Izin lokasi ditolak. Izinkan lokasi pada browser.",
          "location-error"
        );

      } else if (
        error.code === 2
      ) {

        tampilkanLokasi(
          "❌ Lokasi tidak tersedia.",
          "location-error"
        );

      } else {

        tampilkanLokasi(
          "❌ Gagal mendapatkan lokasi.",
          "location-error"
        );
      }

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}


/* =====================================================
   AKTIFKAN / MATIKAN TOMBOL
===================================================== */

function tombolAbsensi(
  aktif
) {

  document.getElementById(
    "cameraBtn"
  ).disabled = !aktif;

  document.getElementById(
    "pulangBtn"
  ).disabled = !aktif;
}


/* =====================================================
   KAMERA
===================================================== */

async function mulaiKamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }

        },

        audio: false
      });


    video.srcObject =
      stream;


  } catch (error) {

    tampilkanStatus(
      "Kamera tidak bisa dibuka. Izinkan akses kamera pada browser.",
      "error"
    );

    console.error(error);
  }
}


/* =====================================================
   ABSEN MASUK
===================================================== */

function ambilFoto() {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (
    nama.length < 2
  ) {

    tampilkanStatus(
      "Masukkan nama terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Pilih kelas terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!lokasiValid()) {
    return;
  }


  if (sedangMengirim) {
    return;
  }


  ambilFotoDariKamera(
    "masuk"
  );
}


/* =====================================================
   ABSEN PULANG
===================================================== */

function ambilFotoPulang() {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (
    nama.length < 2
  ) {

    tampilkanStatus(
      "Masukkan nama terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Pilih kelas terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!lokasiValid()) {
    return;
  }


  if (sedangMengirim) {
    return;
  }


  ambilFotoDariKamera(
    "pulang"
  );
}


/* =====================================================
   CEK LOKASI SEBELUM ABSEN
===================================================== */

function lokasiValid() {

  if (!lokasiSaatIni) {

    tampilkanStatus(
      "❌ Lokasi belum terverifikasi.",
      "error"
    );

    cekLokasi();

    return false;
  }


  if (
    lokasiSaatIni.jarak >
    BATAS_JARAK
  ) {

    tampilkanStatus(
      "❌ Anda berada di luar area sekolah.",
      "error"
    );

    cekLokasi();

    return false;
  }


  if (
    lokasiSaatIni.accuracy >
    BATAS_AKURASI
  ) {

    tampilkanStatus(
      "❌ Akurasi GPS terlalu rendah.",
      "error"
    );

    cekLokasi();

    return false;
  }


  return true;
}


/* =====================================================
   AMBIL FOTO
===================================================== */

function ambilFotoDariKamera(
  jenis
) {

  const context =
    canvas.getContext("2d");


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    tampilkanStatus(
      "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
      "error"
    );

    return;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  canvas.toBlob(

    function(blob) {

      fotoBlob =
        blob;


      preview.src =
        URL.createObjectURL(
          blob
        );


      preview.style.display =
        "block";


      kirimAbsensi(
        jenis
      );

    },

    "image/jpeg",

    0.8
  );
}


/* =====================================================
   KIRIM ABSENSI
===================================================== */

async function kirimAbsensi(
  jenis
) {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (!nama) {

    tampilkanStatus(
      "Nama wajib diisi.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Kelas wajib dipilih.",
      "error"
    );

    return;
  }


  if (!fotoBlob) {

    tampilkanStatus(
      "Foto belum tersedia.",
      "error"
    );

    return;
  }


  /*
     CEK LOKASI SEKALI LAGI
  */

  if (!lokasiValid()) {
    return;
  }


  sedangMengirim =
    true;


  document.getElementById(
    "cameraBtn"
  ).disabled = true;


  document.getElementById(
    "pulangBtn"
  ).disabled = true;


  tampilkanStatus(
    "📍 Memeriksa lokasi dan mengirim absensi...",
    "success"
  );


  try {

    /*
       AMBIL DATA GPS TERBARU
    */

    const position =
      await dapatkanLokasiTerbaru();


    const latitude =
      position.coords.latitude;

    const longitude =
      position.coords.longitude;

    const accuracy =
      position.coords.accuracy;


    const jarak =
      hitungJarak(
        latitude,
        longitude,
        SEKOLAH_LAT,
        SEKOLAH_LNG
      );


    /*
       JANGAN LANJUT JIKA DI LUAR RADIUS
    */

    if (
      jarak >
      BATAS_JARAK
    ) {

      throw new Error(
        "Anda berada di luar area sekolah. Jarak: " +
        Math.round(jarak) +
        " meter."
      );
    }


    /*
       JANGAN LANJUT JIKA GPS TIDAK AKURAT
    */

    if (
      accuracy >
      BATAS_AKURASI
    ) {

      throw new Error(
        "GPS kurang akurat. Akurasi: " +
        Math.round(accuracy) +
        " meter."
      );
    }


    /*
       NAMA FILE
    */

    const waktu =
      Date.now();


    const namaFile =
      nama
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-|-$/g,
          ""
        );


    const tanggal =
      new Date()
        .toISOString()
        .slice(
          0,
          10
        );


    const filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      waktu +
      ".jpg";


    /*
       UPLOAD FOTO
    */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("selfies")
        .upload(
          filePath,
          fotoBlob,
          {
            contentType:
              "image/jpeg",

            upsert:
              false
          }
        );


    if (
      uploadError
    ) {

      throw uploadError;
    }


    /*
       SIMPAN ABSENSI + LOKASI
    */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("absensi")
        .insert({

          nama:
            nama,

          kelas:
            kelas,

          jenis:
            jenis,

          foto_path:
            filePath,

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            accuracy

        });


    /*
       JIKA DATABASE GAGAL,
       HAPUS FOTO
    */

    if (
      insertError
    ) {

      await supabaseClient
        .storage
        .from("selfies")
        .remove([
          filePath
        ]);


      throw insertError;
    }


    /*
       BERHASIL
    */

    if (
      jenis === "masuk"
    ) {

      tampilkanStatus(
        "✅ Absen masuk berhasil!",
        "success"
      );

    } else {

      tampilkanStatus(
        "✅ Absen pulang berhasil!",
        "success"
      );

    }


    /*
       RESET
    */

    fotoBlob =
      null;


    preview.style.display =
      "none";


    document.getElementById(
      "nama"
    ).value = "";


    document.getElementById(
      "kelas"
    ).value = "";


    /*
       CEK LOKASI LAGI
    */

    cekLokasi();


  } catch (error) {

    console.error(
      error
    );


    if (
      error.code ===
      "23505"
    ) {

      if (
        jenis === "masuk"
      ) {

        tampilkanStatus(
          "⚠️ Anda sudah melakukan absen masuk hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "⚠️ Anda sudah melakukan absen pulang hari ini.",
          "error"
        );
      }

    } else {

      tampilkanStatus(
        "❌ " +
        error.message,
        "error"
      );
    }

  }


  sedangMengirim =
    false;


  /*
     Tombol akan aktif lagi
     jika lokasi valid
  */

  if (
    lokasiSaatIni &&
    lokasiSaatIni.jarak <=
      BATAS_JARAK &&
    lokasiSaatIni.accuracy <=
      BATAS_AKURASI
  ) {

    tombolAbsensi(true);

  } else {

    tombolAbsensi(false);
  }
}


/* =====================================================
   DAPATKAN GPS TERBARU
===================================================== */

function dapatkanLokasiTerbaru() {

  return new Promise(
    function(resolve, reject) {

      navigator.geolocation.getCurrentPosition(

        resolve,

        reject,

        {
          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0
        }

      );

    }
  );
}


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(
  pesan,
  tipe
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    pesan;


  status.className =
    "status " +
    tipe;
}
