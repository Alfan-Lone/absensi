<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABSENSI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      color: #111827;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .camera {
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 3/4;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .camera-text {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      background: rgba(0,0,0,.5);
      padding: 8px;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .camera-btn {
      background: #2563eb;
      color: white;
    }

    .masuk {
      background: #16a34a;
      color: white;
    }

    .pulang {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .preview {
      display: none;
      width: 100%;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 18px;
    }

    .date {
      text-align: center;
      color: #374151;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">📸</div>

    <h1>ABSENSI</h1>

    <div class="subtitle">
      Absensi dengan foto selfie
    </div>

    <div class="date" id="tanggal"></div>

    <label for="nama">Nama Lengkap</label>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama Anda"
      autocomplete="name"
    >

    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
      ></video>

      <div class="camera-text">
        Pastikan wajah terlihat jelas
      </div>

    </div>

    <canvas id="canvas"></canvas>

    <img
      id="preview"
      class="preview"
      alt="Preview selfie"
    >

    <button
      class="camera-btn"
      id="cameraBtn"
      onclick="ambilFoto()"
    >
      📷 AMBIL FOTO SELFIE
    </button>

    <button
      class="masuk"
      id="masukBtn"
      onclick="kirimAbsensi('masuk')"
      disabled
    >
      🟢 ABSEN MASUK
    </button>

    <button
      class="pulang"
      id="pulangBtn"
      onclick="kirimAbsensi('pulang')"
      disabled
    >
      🔴 ABSEN PULANG
    </button>

    <div id="status" class="status"></div>

    <div class="info">
      Pastikan nama sudah benar sebelum melakukan absensi.
    </div>

  </div>

</div>

<script>

  // =====================================================
  // MASUKKAN DATA SUPABASE ANDA DI SINI
  // =====================================================

  const SUPABASE_URL = "https://prcnxtzhukfopcfzyczm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // VARIABEL
  // =====================================================

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const preview = document.getElementById("preview");

  let fotoBlob = null;


  // =====================================================
  // TANGGAL
  // =====================================================

  function tampilkanTanggal() {

    const sekarang = new Date();

    const tanggal = sekarang.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

    document.getElementById("tanggal").textContent =
      tanggal;
  }

  tampilkanTanggal();


  // =====================================================
  // AKTIFKAN KAMERA DEPAN
  // =====================================================

  async function mulaiKamera() {

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: {
              ideal: 720
            },
            height: {
              ideal: 960
            }
          },
          audio: false
        });

      video.srcObject = stream;

    } catch (error) {

      tampilkanStatus(
        "Kamera tidak bisa dibuka. Pastikan izin kamera diberikan.",
        "error"
      );

      console.error(error);
    }
  }


  // =====================================================
  // AMBIL FOTO
  // =====================================================

  function ambilFoto() {

    const nama =
      document.getElementById("nama").value.trim();

    if (nama.length < 2) {

      tampilkanStatus(
        "Masukkan nama terlebih dahulu.",
        "error"
      );

      return;
    }

    const context =
      canvas.getContext("2d");

    const width = video.videoWidth;
    const height = video.videoHeight;

    canvas.width = width;
    canvas.height = height;

    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    canvas.toBlob(
      function(blob) {

        fotoBlob = blob;

        preview.src =
          URL.createObjectURL(blob);

        preview.style.display =
          "block";

        document.getElementById("masukBtn")
          .disabled = false;

        document.getElementById("pulangBtn")
          .disabled = false;

        tampilkanStatus(
          "Foto berhasil diambil. Silakan pilih jenis absensi.",
          "success"
        );

      },
      "image/jpeg",
      0.8
    );
  }


  // =====================================================
  // KIRIM ABSENSI
  // =====================================================

  async function kirimAbsensi(jenis) {

    const nama =
      document.getElementById("nama")
        .value.trim();

    if (!nama) {

      tampilkanStatus(
        "Nama wajib diisi.",
        "error"
      );

      return;
    }

    if (!fotoBlob) {

      tampilkanStatus(
        "Silakan ambil foto selfie terlebih dahulu.",
        "error"
      );

      return;
    }


    const masukBtn =
      document.getElementById("masukBtn");

    const pulangBtn =
      document.getElementById("pulangBtn");

    masukBtn.disabled = true;
    pulangBtn.disabled = true;


    tampilkanStatus(
      "Mengirim absensi...",
      "success"
    );


    try {

      // -----------------------------------------------
      // NAMA FILE FOTO
      // -----------------------------------------------

      const waktu =
        Date.now();

      const namaFile =
        nama
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");

      const filePath =
        new Date().toISOString().slice(0,10)
        + "/"
        + namaFile
        + "-"
        + jenis
        + "-"
        + waktu
        + ".jpg";


      // -----------------------------------------------
      // UPLOAD FOTO
      // -----------------------------------------------

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("selfies")
          .upload(
            filePath,
            fotoBlob,
            {
              contentType: "image/jpeg",
              upsert: false
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      // -----------------------------------------------
      // SIMPAN DATA ABSENSI
      // -----------------------------------------------

      const {
        error: insertError
      } =
        await supabaseClient
          .from("absensi")
          .insert({
            nama: nama,
            jenis: jenis,
            foto_path: filePath
          });


      if (insertError) {

        // Kalau database gagal, hapus foto
        await supabaseClient
          .storage
          .from("selfies")
          .remove([filePath]);

        throw insertError;
      }


      // -----------------------------------------------
      // BERHASIL
      // -----------------------------------------------

      const teksJenis =
        jenis === "masuk"
          ? "ABSEN MASUK"
          : "ABSEN PULANG";


      tampilkanStatus(
        "✅ " + teksJenis +
        " berhasil dicatat!",
        "success"
      );


      // Reset
      fotoBlob = null;

      preview.style.display = "none";

      document.getElementById("nama").value = "";

      setTimeout(() => {

        masukBtn.disabled = true;
        pulangBtn.disabled = true;

      }, 1000);


    } catch (error) {

      console.error(error);

      if (
        error.code === "23505"
      ) {

        tampilkanStatus(
          "Nama tersebut sudah melakukan " +
          jenis +
          " hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "Gagal menyimpan absensi: " +
          error.message,
          "error"
        );
      }

      masukBtn.disabled = false;
      pulangBtn.disabled = false;
    }
  }


  // =====================================================
  // STATUS
  // =====================================================

  function tampilkanStatus(
    pesan,
    tipe
  ) {

    const status =
      document.getElementById("status");

    status.textContent = pesan;

    status.className =
      "status " + tipe;
  }


  // =====================================================
  // MULAI
  // =====================================================

  mulaiKamera();

</script>

</body>
</html>
