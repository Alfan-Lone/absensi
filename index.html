<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL = "https://prcnxtzhukfopcfzyczm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // VARIABEL
  // =====================================================

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const preview =
    document.getElementById("preview");

  let fotoBlob = null;
  let sedangMengirim = false;


  // =====================================================
  // TANGGAL
  // =====================================================

  function tampilkanTanggal() {

    const sekarang = new Date();

    const tanggal =
      sekarang.toLocaleDateString(
        "id-ID",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    document.getElementById("tanggal")
      .textContent = tanggal;
  }

  tampilkanTanggal();


  // =====================================================
  // KAMERA
  // =====================================================

  async function mulaiKamera() {

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: {
              ideal: 720
            },
            height: {
              ideal: 960
            }
          },
          audio: false
        });

      video.srcObject = stream;

    } catch (error) {

      tampilkanStatus(
        "Kamera tidak bisa dibuka. Izinkan akses kamera pada browser.",
        "error"
      );

      console.error(error);
    }
  }


  // =====================================================
  // AMBIL FOTO
  // OTOMATIS ABSEN MASUK
  // =====================================================

  function ambilFoto() {

    const nama =
      document.getElementById("nama")
        .value.trim();

    if (nama.length < 2) {

      tampilkanStatus(
        "Masukkan nama terlebih dahulu.",
        "error"
      );

      return;
    }

    if (sedangMengirim) {
      return;
    }

    ambilFotoDariKamera("masuk");
  }


  // =====================================================
  // FOTO PULANG
  // =====================================================

  function ambilFotoPulang() {

    const nama =
      document.getElementById("nama")
        .value.trim();

    if (nama.length < 2) {

      tampilkanStatus(
        "Masukkan nama terlebih dahulu.",
        "error"
      );

      return;
    }

    if (sedangMengirim) {
      return;
    }

    ambilFotoDariKamera("pulang");
  }


  // =====================================================
  // AMBIL FOTO DARI KAMERA
  // =====================================================

  function ambilFotoDariKamera(jenis) {

    const context =
      canvas.getContext("2d");

    const width =
      video.videoWidth;

    const height =
      video.videoHeight;

    if (!width || !height) {

      tampilkanStatus(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;
    }

    canvas.width = width;
    canvas.height = height;

    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    canvas.toBlob(
      function(blob) {

        fotoBlob = blob;

        preview.src =
          URL.createObjectURL(blob);

        preview.style.display =
          "block";

        // LANGSUNG KIRIM ABSENSI
        kirimAbsensi(jenis);

      },
      "image/jpeg",
      0.8
    );
  }


  // =====================================================
  // KIRIM ABSENSI
  // =====================================================

  async function kirimAbsensi(jenis) {

    const nama =
      document.getElementById("nama")
        .value.trim();

    if (!nama) {

      tampilkanStatus(
        "Nama wajib diisi.",
        "error"
      );

      return;
    }

    if (!fotoBlob) {

      tampilkanStatus(
        "Foto belum tersedia.",
        "error"
      );

      return;
    }

    sedangMengirim = true;

    document.getElementById("cameraBtn")
      .disabled = true;

    document.getElementById("pulangBtn")
      .disabled = true;

    tampilkanStatus(
      "Mengirim foto dan menyimpan absensi...",
      "success"
    );


    try {

      // =================================================
      // NAMA FILE
      // =================================================

      const waktu =
        Date.now();

      const namaFile =
        nama
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");

      const tanggal =
        new Date()
          .toISOString()
          .slice(0, 10);

      const filePath =
        tanggal +
        "/" +
        namaFile +
        "-" +
        jenis +
        "-" +
        waktu +
        ".jpg";


      // =================================================
      // UPLOAD FOTO
      // =================================================

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("selfies")
          .upload(
            filePath,
            fotoBlob,
            {
              contentType: "image/jpeg",
              upsert: false
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      // =================================================
      // SIMPAN ABSENSI
      // =================================================

      const {
        error: insertError
      } =
        await supabaseClient
          .from("absensi")
          .insert({
            nama: nama,
            jenis: jenis,
            foto_path: filePath
          });


      // Kalau database gagal,
      // foto yang baru diupload ikut dihapus

      if (insertError) {

        await supabaseClient
          .storage
          .from("selfies")
          .remove([
            filePath
          ]);

        throw insertError;
      }


      // =================================================
      // BERHASIL
      // =================================================

      if (jenis === "masuk") {

        tampilkanStatus(
          "✅ Absen masuk berhasil!",
          "success"
        );

      } else {

        tampilkanStatus(
          "✅ Absen pulang berhasil!",
          "success"
        );

      }


      // Reset foto

      fotoBlob = null;

      preview.style.display =
        "none";

      document.getElementById("nama")
        .value = "";


    } catch (error) {

      console.error(error);

      // ===============================================
      // SUDAH ABSEN
      // ===============================================

      if (
        error.code === "23505"
      ) {

        if (jenis === "masuk") {

          tampilkanStatus(
            "⚠️ Anda sudah melakukan absen masuk hari ini.",
            "error"
          );

        } else {

          tampilkanStatus(
            "⚠️ Anda sudah melakukan absen pulang hari ini.",
            "error"
          );
        }

      } else {

        tampilkanStatus(
          "❌ Gagal menyimpan absensi: " +
          error.message,
          "error"
        );
      }

    }


    sedangMengirim = false;

    document.getElementById("cameraBtn")
      .disabled = false;

    document.getElementById("pulangBtn")
      .disabled = false;
  }


  // =====================================================
  // STATUS
  // =====================================================

  function tampilkanStatus(
    pesan,
    tipe
  ) {

    const status =
      document.getElementById("status");

    status.textContent =
      pesan;

    status.className =
      "status " + tipe;
  }


  // =====================================================
  // START
  // =====================================================

  mulaiKamera();

</script>

</body>
</html>
