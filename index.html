<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABSENSI EKSKUL INFORMATIKA</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.65)),
        url("logo.pngf") center/cover fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,.96);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 12px;
      border: 4px solid #0b8f4d;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      color: #087a40;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 2px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #0b8f4d;
    }

    .camera-box {
      width: 100%;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    video {
      width: 100%;
      display: block;

      /* TIDAK MIRROR */
      transform: scaleX(1);
    }

    canvas {
      display: none;
    }

    .camera-status {
      text-align: center;
      padding: 8px;
      background: #f1f1f1;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-camera {
      background: #555;
    }

    .btn-camera:hover {
      background: #333;
    }

    .btn-masuk {
      background: #087f43;
    }

    .btn-masuk:hover {
      background: #066b38;
    }

    .btn-pulang {
      background: #d62828;
    }

    .btn-pulang:hover {
      background: #b51f1f;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #d8f5e5;
      color: #087a40;
    }

    .error {
      display: block;
      background: #ffe0e0;
      color: #b00020;
    }

    .loading {
      display: block;
      background: #fff1c7;
      color: #795900;
    }

    .info {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #eef7ff;
      color: #24516e;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo" alt="Logo Sekolah">

  <h1>ABSENSI EKSKUL INFORMATIKA</h1>
  <div class="subtitle">Silakan isi data dan lakukan selfie</div>

  <label for="nama">Nama Lengkap</label>
  <input
    type="text"
    id="nama"
    placeholder="Masukkan nama lengkap"
    autocomplete="off"
  >

  <label for="kelas">Kelas</label>
  <select id="kelas">
    <option value="">-- Pilih Kelas --</option>
    <option value="X">X</option>
    <option value="XI">XI</option>
    <option value="XII">XII</option>
  </select>

  <label>Foto Selfie</label>

  <div class="camera-box">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="cameraStatus" class="camera-status">
    Kamera belum diaktifkan
  </div>

  <button class="btn btn-camera" id="cameraBtn" onclick="startCamera()">
    📷 AKTIFKAN KAMERA
  </button>

  <button
    class="btn btn-camera"
    id="takePhotoBtn"
    onclick="takePhoto()"
    disabled
  >
    📸 AMBIL FOTO
  </button>

  <img id="preview" alt="Preview Foto">

  <button
    class="btn btn-masuk"
    id="masukBtn"
    onclick="submitAbsensi('masuk')"
    disabled
  >
    🟢 ABSEN MASUK
  </button>

  <button
    class="btn btn-pulang"
    id="pulangBtn"
    onclick="submitAbsensi('pulang')"
    disabled
  >
    🔴 ABSEN PULANG
  </button>

  <div id="message" class="message"></div>

  <div class="info">
    📸 Foto digunakan untuk keperluan absensi.<br>
    🔒 Data disimpan ke sistem absensi sekolah.
  </div>

</div>


<script>
  // ==========================================
  // KONFIGURASI SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://prcnxtzhukfopcfzyczm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENT
  // ==========================================

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const preview = document.getElementById("preview");

  const namaInput = document.getElementById("nama");
  const kelasInput = document.getElementById("kelas");

  const cameraBtn = document.getElementById("cameraBtn");
  const takePhotoBtn = document.getElementById("takePhotoBtn");

  const masukBtn = document.getElementById("masukBtn");
  const pulangBtn = document.getElementById("pulangBtn");

  const cameraStatus = document.getElementById("cameraStatus");
  const message = document.getElementById("message");

  let stream = null;
  let photoBlob = null;


  // ==========================================
  // START CAMERA
  // ==========================================

  async function startCamera() {

    try {

      message.className = "message";
      message.textContent = "";

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {

        showMessage(
          "Browser tidak mendukung kamera.",
          "error"
        );

        return;
      }

      // Kalau kamera sebelumnya aktif
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      });

      video.srcObject = stream;

      cameraStatus.textContent =
        "🟢 Kamera aktif";

      cameraStatus.style.color = "#087a40";

      cameraBtn.textContent =
        "🔄 KAMERA AKTIF";

      takePhotoBtn.disabled = false;

    } catch (error) {

      console.error(error);

      cameraStatus.textContent =
        "🔴 Kamera tidak dapat digunakan";

      cameraStatus.style.color = "#b00020";

      showMessage(
        "Kamera belum diizinkan. Silakan izinkan akses kamera pada browser lalu tekan tombol kamera lagi.",
        "error"
      );
    }
  }


  // ==========================================
  // TAKE PHOTO
  // ==========================================

  function takePhoto() {

    if (!stream) {

      showMessage(
        "Aktifkan kamera terlebih dahulu.",
        "error"
      );

      return;
    }

    if (!video.videoWidth || !video.videoHeight) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    /*
      FOTO TIDAK DI-MIRROR.
      Tidak menggunakan scale(-1, 1).
    */

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    canvas.toBlob(
      function(blob) {

        photoBlob = blob;

        preview.src =
          URL.createObjectURL(blob);

        preview.style.display = "block";

        masukBtn.disabled = false;
        pulangBtn.disabled = false;

        showMessage(
          "Foto berhasil diambil. Silakan pilih jenis absensi.",
          "success"
        );

      },
      "image/jpeg",
      0.85
    );
  }


  // ==========================================
  // SUBMIT ABSENSI
  // ==========================================

  async function submitAbsensi(jenis) {

    const nama =
      namaInput.value.trim();

    const kelas =
      kelasInput.value;

    if (!nama) {

      showMessage(
        "Nama lengkap wajib diisi.",
        "error"
      );

      namaInput.focus();

      return;
    }

    if (!kelas) {

      showMessage(
        "Silakan pilih kelas.",
        "error"
      );

      kelasInput.focus();

      return;
    }

    if (!photoBlob) {

      showMessage(
        "Silakan ambil foto terlebih dahulu.",
        "error"
      );

      return;
    }

    masukBtn.disabled = true;
    pulangBtn.disabled = true;

    showMessage(
      "⏳ Mengirim absensi...",
      "loading"
    );

    try {

      const sekarang = new Date();

      const tanggal =
        sekarang.toLocaleDateString(
          "en-CA",
          {
            timeZone: "Asia/Jakarta"
          }
        );

      const jam =
        sekarang.toLocaleTimeString(
          "en-GB",
          {
            timeZone: "Asia/Jakarta",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

      // Nama file foto
      const safeName =
        nama
          .replace(/[^a-zA-Z0-9]/g, "_")
          .toLowerCase();

      const timestamp =
        Date.now();

      const filePath =
        `${tanggal}/${safeName}_${timestamp}.jpg`;


      // ==========================================
      // UPLOAD FOTO KE STORAGE
      // ==========================================

      const uploadResult =
        await supabaseClient.storage
          .from("selfies")
          .upload(
            filePath,
            photoBlob,
            {
              contentType: "image/jpeg",
              upsert: false
            }
          );

      if (uploadResult.error) {
        throw uploadResult.error;
      }


      // ==========================================
      // SIMPAN DATA ABSEN
      // ==========================================

      const insertResult =
        await supabaseClient
          .from("absensi")
          .insert({

            tanggal: tanggal,

            jam: jam,

            nama: nama,

            kelas: kelas,

            jenis: jenis,

            foto_path: filePath

          });


      if (insertResult.error) {

        // Kalau insert gagal, foto yang sudah
        // diupload kita coba hapus kembali.
        await supabaseClient.storage
          .from("selfies")
          .remove([filePath]);

        throw insertResult.error;
      }


      // ==========================================
      // BERHASIL
      // ==========================================

      showMessage(
        `✅ ABSEN ${jenis.toUpperCase()} BERHASIL!`,
        "success"
      );

      namaInput.value = "";
      kelasInput.value = "";

      preview.src = "";
      preview.style.display = "none";

      photoBlob = null;

      masukBtn.disabled = true;
      pulangBtn.disabled = true;


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Gagal menyimpan absensi: " +
        (error.message || "Terjadi kesalahan."),
        "error"
      );

      masukBtn.disabled = false;
      pulangBtn.disabled = false;
    }
  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;
  }


  // ==========================================
  // STOP CAMERA SAAT HALAMAN DITUTUP
  // ==========================================

  window.addEventListener(
    "beforeunload",
    function() {

      if (stream) {

        stream
          .getTracks()
          .forEach(track => track.stop());
      }

    }
  );

</script>

</body>
</html>
