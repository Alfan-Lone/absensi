<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABEL
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

let fotoBlob = null;

let sedangMengirim = false;


/* =====================================================
   WAKTU WIB
===================================================== */

function waktuWIB() {

  const sekarang = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Jakarta",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }
    );

  const bagian =
    formatter.formatToParts(sekarang);

  const nilai = {};

  bagian.forEach(
    function(item) {
      nilai[item.type] = item.value;
    }
  );

  return {
    tanggal:
      nilai.year +
      "-" +
      nilai.month +
      "-" +
      nilai.day,

    jam:
      nilai.hour +
      ":" +
      nilai.minute +
      ":" +
      nilai.second
  };
}


/* =====================================================
   TANGGAL TAMPILAN
===================================================== */

function tampilkanTanggal() {

  const sekarang = new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        timeZone: "Asia/Jakarta",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  document.getElementById(
    "tanggal"
  ).textContent = tanggal;
}

tampilkanTanggal();


/* =====================================================
   KAMERA
===================================================== */

async function mulaiKamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    tombolAbsensi(true);


  } catch (error) {

    console.error(error);

    tampilkanStatus(
      "❌ Kamera tidak bisa dibuka. Izinkan akses kamera pada browser.",
      "error"
    );

  }
}


/* =====================================================
   AKTIFKAN TOMBOL
===================================================== */

function tombolAbsensi(aktif) {

  document.getElementById(
    "cameraBtn"
  ).disabled = !aktif;

  document.getElementById(
    "pulangBtn"
  ).disabled = !aktif;
}


/* =====================================================
   ABSEN MASUK
===================================================== */

function ambilFoto() {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (nama.length < 2) {

    tampilkanStatus(
      "Masukkan nama terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Pilih kelas terlebih dahulu.",
      "error"
    );

    return;
  }


  if (sedangMengirim) {
    return;
  }


  ambilFotoDariKamera("masuk");
}


/* =====================================================
   ABSEN PULANG
===================================================== */

function ambilFotoPulang() {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (nama.length < 2) {

    tampilkanStatus(
      "Masukkan nama terlebih dahulu.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Pilih kelas terlebih dahulu.",
      "error"
    );

    return;
  }


  if (sedangMengirim) {
    return;
  }


  ambilFotoDariKamera("pulang");
}


/* =====================================================
   AMBIL FOTO
===================================================== */

function ambilFotoDariKamera(jenis) {

  const context =
    canvas.getContext("2d");


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    tampilkanStatus(
      "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
      "error"
    );

    return;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  canvas.toBlob(

    function(blob) {

      fotoBlob =
        blob;


      preview.src =
        URL.createObjectURL(blob);


      preview.style.display =
        "block";


      kirimAbsensi(jenis);

    },

    "image/jpeg",

    0.8

  );
}


/* =====================================================
   KIRIM ABSENSI
===================================================== */

async function kirimAbsensi(jenis) {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  if (!nama) {

    tampilkanStatus(
      "Nama wajib diisi.",
      "error"
    );

    return;
  }


  if (!kelas) {

    tampilkanStatus(
      "Kelas wajib dipilih.",
      "error"
    );

    return;
  }


  if (!fotoBlob) {

    tampilkanStatus(
      "Foto belum tersedia.",
      "error"
    );

    return;
  }


  sedangMengirim = true;


  tombolAbsensi(false);


  tampilkanStatus(
    "📤 Mengirim absensi...",
    "success"
  );


  try {

    /* ================================================
       AMBIL WAKTU WIB
    ================================================ */

    const waktu =
      waktuWIB();


    const tanggal =
      waktu.tanggal;


    const jam =
      waktu.jam;


    /* ================================================
       NAMA FILE
    ================================================ */

    const timestamp =
      Date.now();


    const namaFile =
      nama
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-|-$/g,
          ""
        );


    const filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      timestamp +
      ".jpg";


    /* ================================================
       UPLOAD FOTO
    ================================================ */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("selfies")
        .upload(
          filePath,
          fotoBlob,
          {
            contentType:
              "image/jpeg",

            upsert:
              false
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    /* ================================================
       SIMPAN DATA ABSENSI
    ================================================ */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("absensi")
        .insert({

          nama:
            nama,

          kelas:
            kelas,

          tanggal:
            tanggal,

          jam:
            jam,

          jenis:
            jenis,

          foto_path:
            filePath

        });


    /* ================================================
       JIKA DATABASE GAGAL
    ================================================ */

    if (insertError) {

      await supabaseClient
        .storage
        .from("selfies")
        .remove([
          filePath
        ]);

      throw insertError;
    }


    /* ================================================
       BERHASIL
    ================================================ */

    if (jenis === "masuk") {

      tampilkanStatus(
        "✅ Absen masuk berhasil pada " + jam + " WIB",
        "success"
      );

    } else {

      tampilkanStatus(
        "✅ Absen pulang berhasil pada " + jam + " WIB",
        "success"
      );

    }


    /* ================================================
       RESET
    ================================================ */

    fotoBlob = null;


    preview.style.display =
      "none";


    document.getElementById(
      "nama"
    ).value = "";


    document.getElementById(
      "kelas"
    ).value = "";


  } catch (error) {

    console.error(error);


    if (error.code === "23505") {

      if (jenis === "masuk") {

        tampilkanStatus(
          "⚠️ Anda sudah melakukan absen masuk hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "⚠️ Anda sudah melakukan absen pulang hari ini.",
          "error"
        );

      }

    } else {

      tampilkanStatus(
        "❌ " + error.message,
        "error"
      );

    }

  }


  sedangMengirim =
    false;


  tombolAbsensi(true);
}


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(
  pesan,
  tipe
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    pesan;


  status.className =
    "status " +
    tipe;
}


/* =====================================================
   START
===================================================== */

mulaiKamera();

</script>

</body>
</html>
