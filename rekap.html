  <div class="controls">

<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    "https://prcnxtzhukfopcfzyczm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // DATA
  // =====================================================

  let semuaData = [];


  // =====================================================
  // SET TANGGAL HARI INI
  // =====================================================

  function setTanggalHariIni() {

    const sekarang =
      new Date();

    const tahun =
      sekarang.getFullYear();

    const bulan =
      String(
        sekarang.getMonth() + 1
      ).padStart(2, "0");

    const hari =
      String(
        sekarang.getDate()
      ).padStart(2, "0");

    document.getElementById(
      "tanggal"
    ).value =
      `${tahun}-${bulan}-${hari}`;
  }


  // =====================================================
  // AMBIL DATA
  // =====================================================

  async function ambilData() {

    tampilkanError("");

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td colspan="6" class="loading">
          ⏳ Memuat data...
        </td>
      </tr>
    `;


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("absensi")
          .select("*")
          .order(
            "tanggal",
            {
              ascending: false
            }
          )
          .order(
            "jam",
            {
              ascending: false
            }
          );


      if (error) {
        throw error;
      }


      semuaData =
        data || [];


      tampilkanData();

    } catch (error) {

      console.error(error);

      tampilkanError(
        "Gagal mengambil data: " +
        error.message
      );

      document.getElementById(
        "tabelData"
      ).innerHTML = `
        <tr>
          <td
            colspan="6"
            class="loading"
          >
            Data tidak dapat dimuat.
          </td>
        </tr>
      `;
    }
  }


  // =====================================================
  // TAMPILKAN DATA
  // =====================================================

  function tampilkanData() {

    const tanggal =
      document.getElementById(
        "tanggal"
      ).value;

    const kata =
      document.getElementById(
        "cari"
      ).value
        .trim()
        .toLowerCase();


    let data =
      semuaData.filter(
        item => {

          const cocokTanggal =
            !tanggal ||
            item.tanggal === tanggal;

          const cocokNama =
            !kata ||
            item.nama
              .toLowerCase()
              .includes(kata);

          return (
            cocokTanggal &&
            cocokNama
          );
        }
      );


    // ===================================================
    // STATISTIK
    // ===================================================

    const namaUnik =
      new Set(
        data.map(
          item => item.nama
        )
      );


    const jumlahMasuk =
      data.filter(
        item =>
          item.jenis === "masuk"
      ).length;


    const jumlahPulang =
      data.filter(
        item =>
          item.jenis === "pulang"
      ).length;


    document.getElementById(
      "jumlahOrang"
    ).textContent =
      namaUnik.size;


    document.getElementById(
      "jumlahMasuk"
    ).textContent =
      jumlahMasuk;


    document.getElementById(
      "jumlahPulang"
    ).textContent =
      jumlahPulang;


    // ===================================================
    // TABEL
    // ===================================================

    const tabel =
      document.getElementById(
        "tabelData"
      );


    if (data.length === 0) {

      tabel.innerHTML = `
        <tr>
          <td
            colspan="6"
            class="loading"
          >
            📭 Tidak ada data absensi.
          </td>
        </tr>
      `;

      return;
    }


    tabel.innerHTML =
      data.map(
        (item, index) => {

          const status =
            item.jenis === "masuk"
              ? `
                <span
                  class="badge badge-masuk"
                >
                  🟢 MASUK
                </span>
              `
              : `
                <span
                  class="badge badge-pulang"
                >
                  🔴 PULANG
                </span>
              `;


          const foto =
            buatFoto(item.foto_path);


          return `
            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                <strong>
                  ${escapeHTML(item.nama)}
                </strong>
              </td>

              <td>
                ${formatTanggal(
                  item.tanggal
                )}
              </td>

              <td>
                ${item.jam || "-"}
              </td>

              <td>
                ${status}
              </td>

              <td>
                ${foto}
              </td>

            </tr>
          `;
        }
      ).join("");
  }


  // =====================================================
  // FOTO
  // =====================================================

  function buatFoto(
    path
  ) {

    if (!path) {

      return `
        <span class="tidak-ada">
          Tidak ada
        </span>
      `;
    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from("selfies")
        .getPublicUrl(path);


    const url =
      data.publicUrl;


    return `
      <img
        class="foto"
        src="${url}"
        alt="Selfie"
        onclick="bukaFoto('${url}')"
        onerror="this.style.display='none'"
      >
    `;
  }


  // =====================================================
  // FOTO BESAR
  // =====================================================

  function bukaFoto(
    url
  ) {

    document.getElementById(
      "fotoBesar"
    ).src = url;

    document.getElementById(
      "modal"
    ).style.display =
      "flex";
  }


  function tutupFoto() {

    document.getElementById(
      "modal"
    ).style.display =
      "none";
  }


  // =====================================================
  // FORMAT TANGGAL
  // =====================================================

  function formatTanggal(
    tanggal
  ) {

    if (!tanggal) {
      return "-";
    }


    const bagian =
      tanggal.split("-");


    return `${bagian[2]}-${bagian[1]}-${bagian[0]}`;
  }


  // =====================================================
  // RESET
  // =====================================================

  function hapusFilter() {

    document.getElementById(
      "cari"
    ).value = "";

    setTanggalHariIni();

    tampilkanData();
  }


  // =====================================================
  // DOWNLOAD CSV
  // =====================================================

  function downloadCSV() {

    const tanggal =
      document.getElementById(
        "tanggal"
      ).value;

    const kata =
      document.getElementById(
        "cari"
      ).value
        .trim()
        .toLowerCase();


    const data =
      semuaData.filter(
        item => {

          const cocokTanggal =
            !tanggal ||
            item.tanggal === tanggal;

          const cocokNama =
            !kata ||
            item.nama
              .toLowerCase()
              .includes(kata);

          return (
            cocokTanggal &&
            cocokNama
          );
        }
      );


    if (data.length === 0) {

      alert(
        "Tidak ada data untuk didownload."
      );

      return;
    }


    let csv =
      "No,Nama,Tanggal,Jam,Jenis,Foto\n";


    data.forEach(
      (item, index) => {

        csv +=
          `${index + 1},` +
          `"${item.nama.replace(/"/g, '""')}",` +
          `${item.tanggal},` +
          `${item.jam},` +
          `${item.jenis},` +
          `"${item.foto_path || ""}"\n`;
      }
    );


    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement(
        "a"
      );


    link.href = url;

    link.download =
      "rekap-absensi.csv";


    document.body.appendChild(
      link
    );

    link.click();

    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      url
    );
  }


  // =====================================================
  // ERROR
  // =====================================================

  function tampilkanError(
    pesan
  ) {

    const box =
      document.getElementById(
        "error"
      );


    if (!pesan) {

      box.style.display =
        "none";

      box.textContent = "";

      return;
    }


    box.textContent =
      pesan;

    box.style.display =
      "block";
  }


  // =====================================================
  // KEAMANAN TAMPILAN NAMA
  // =====================================================

  function escapeHTML(
    text
  ) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // =====================================================
  // JALANKAN
  // =====================================================

  setTanggalHariIni();

  ambilData();

</script>

</body>
</html>
